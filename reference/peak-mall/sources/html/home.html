<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顶峰商城</title>
<style>
  :root{
    --primary:#fd560f; --primary-d:#dc4a0c; --success:#16a34a; --danger:#e54545;
    --brand:#fd560f;
    --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1;
    --gray-500:#64748b; --gray-700:#334155; --gray-900:#0f172a;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{background:var(--gray-100);color:var(--gray-900);font-size:14px;}
  a{color:var(--primary);text-decoration:none;}
  /* 登录/注册 */
  .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:36px 18px;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 55%,#2563eb 100%);}
  .auth-brand{text-align:center;color:#fff;}
  .auth-brand h1{font-size:25px;letter-spacing:1px;}
  .auth-brand p{font-size:13px;color:rgba(255,255,255,.62);margin-top:6px;}
  .auth-split{display:flex;gap:20px;align-items:stretch;justify-content:center;flex-wrap:wrap;}
  .auth-card{background:#fff;border-radius:16px;padding:28px 30px;width:352px;box-shadow:0 20px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;}
  .auth-head{margin-bottom:16px;}
  .auth-head h2{font-size:21px;color:var(--gray-900);}
  .auth-head .cn{font-size:12px;color:var(--gray-500);margin-top:3px;}
  .tabs{display:flex;gap:20px;border-bottom:1px solid var(--gray-200);margin-bottom:18px;}
  .tabs span{padding-bottom:8px;font-size:13px;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;}
  .tabs span.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
  .invite-tip{margin-bottom:14px;padding:9px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;font-size:12px;color:#1d4ed8;}
  .auth-card .sub{color:var(--gray-500);margin-bottom:20px;font-size:13px;}
  @media(max-width:780px){.auth-card{width:100%;max-width:380px;}}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--gray-700);margin-bottom:6px;font-weight:600;}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--gray-300);border-radius:9px;font-size:14px;outline:none;transition:.15s;}
  .field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .btn{padding:11px 18px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--primary);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--primary-d);}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn-ghost{background:var(--gray-100);color:var(--gray-700);}
  .btn-danger{background:#fee2e2;color:var(--danger);}
  .btn-success{background:#dcfce7;color:var(--success);}
  .login-tips{margin-top:18px;padding:12px;background:var(--gray-50);border-radius:9px;font-size:12px;color:var(--gray-500);line-height:1.9;}
  .login-tips a{cursor:pointer;display:block;}
  .msg{margin-top:12px;padding:10px;border-radius:9px;font-size:13px;display:none;}
  .msg.err{background:#fee2e2;color:var(--danger);display:block;}
  .msg.ok{background:#dcfce7;color:var(--success);display:block;}
  /* 商城 */
  .shop-bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .shop-search{flex:1;min-width:200px;display:flex;gap:8px;}
  .shop-search input{flex:1;padding:10px 14px;border:1px solid var(--gray-300);border-radius:9px;font-size:14px;outline:none;}
  .shop-search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .cat{padding:6px 14px;border:1px solid var(--gray-300);border-radius:20px;font-size:13px;cursor:pointer;background:#fff;transition:.15s;}
  .cat:hover{border-color:var(--primary);color:var(--primary);}
  .cat.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px;}
  .prod{background:#fff;border:1px solid var(--gray-200);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column;}
  .prod:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.09);border-color:var(--primary);}
  .prod .cover{height:120px;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(135deg,#eff6ff,#dbeafe);}
  .prod .info{padding:12px 13px;flex:1;display:flex;flex-direction:column;}
  .prod .nm{font-size:13px;font-weight:600;line-height:1.4;max-height:36px;overflow:hidden;}
  .prod .pr{color:var(--danger);font-size:17px;font-weight:700;margin-top:6px;}
  .prod .stx{font-size:11px;color:var(--gray-500);margin-top:3px;}
  .prod .op{padding:0 13px 13px;}
  .line{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;}
  .line .cv{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:10px;flex-shrink:0;}
  .line .tx{flex:1;min-width:120px;}
  .line .tx b{font-size:14px;}
  .line .tx .m{font-size:12px;color:var(--gray-500);margin-top:3px;}
  .qty{display:flex;align-items:center;border:1px solid var(--gray-300);border-radius:8px;overflow:hidden;width:98px;flex-shrink:0;}
  .qty button{width:30px;height:30px;border:none;background:var(--gray-50);cursor:pointer;font-size:15px;color:var(--gray-700);}
  .qty button:hover{background:var(--gray-200);}
  .qty span{flex:1;text-align:center;font-size:13px;}
  .sumbox{margin-top:18px;padding:16px 18px;background:var(--gray-50);border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .sumbox .t{font-size:13px;color:var(--gray-500);}
  .sumbox .t b{font-size:23px;color:var(--danger);margin-left:6px;}
  .tabs2{display:flex;gap:2px;border-bottom:1px solid var(--gray-200);margin-bottom:16px;flex-wrap:wrap;}
  .tabs2 span{padding:9px 15px;font-size:13px;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;}
  .tabs2 span.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
  .ost{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--gray-100);color:var(--gray-500);}
  .ost.pending{background:#fef9c3;color:#a16207;}
  .ost.paid{background:#dbeafe;color:#1d4ed8;}
  .ost.shipped{background:#e0e7ff;color:#4338ca;}
  .ost.completed{background:#dcfce7;color:var(--success);}
  .ost.cancelled{background:#fee2e2;color:var(--danger);}
  .empty{text-align:center;color:var(--gray-500);padding:46px 0;}
  .empty .ic{font-size:44px;margin-bottom:10px;}
  .paybox{max-width:520px;margin:0 auto;text-align:center;}
  .paybox .amt{font-size:36px;font-weight:700;color:var(--danger);margin:12px 0;}
  .pay-methods{display:flex;flex-direction:column;gap:10px;margin:20px 0;text-align:left;}
  .pm{border:1px solid var(--gray-300);border-radius:10px;padding:13px 15px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:.15s;}
  .pm:hover{border-color:var(--primary);}
  .pm.active{border-color:var(--primary);background:#eff6ff;}
  .pm .e{font-size:22px;}
  .pm .n{flex:1;font-size:14px;}
  .pm .k{font-size:12px;color:var(--gray-500);}
  .pm.disabled{opacity:.55;cursor:not-allowed;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f1f5f9 6px,#f1f5f9 12px);}
  .pm.disabled:hover{border-color:var(--gray-300);}
  .pm.disabled .k{color:var(--danger);font-weight:600;}
  .card-brand{width:46px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:.5px;flex-shrink:0;}
  .card-visa{background:linear-gradient(135deg,#1a1f71,#f7b600);}
  .card-mc{background:linear-gradient(135deg,#eb001b 0%,#eb001b 50%,#f79e1b 50%,#f79e1b 100%);}
  .pay-secure{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--gray-500);font-size:12px;margin:14px 0 4px;}
  .pay-secure .l{width:14px;height:14px;border:2px solid var(--success);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--success);font-size:9px;font-weight:800;line-height:1;}
  /* 支付处理中（转圈）遮罩 */
  .paying-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:120;}
  .paying-mask.show{display:flex;}
  .paying-card{background:#fff;border-radius:16px;padding:32px 36px;min-width:290px;max-width:90vw;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.32);animation:pgpop .18s ease-out;}
  @keyframes pgpop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .spin{width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .paying-card .tt{font-size:16px;font-weight:700;color:var(--gray-900);}
  .paying-card .ds{font-size:13px;color:var(--gray-500);margin-top:8px;line-height:1.7;}
  .paying-card .pg{margin-top:18px;height:6px;border-radius:3px;background:#e2e8f0;overflow:hidden;}
  .paying-card .pg i{display:block;height:100%;width:35%;border-radius:3px;background:var(--primary);animation:pgmove 1.3s ease-in-out infinite;}
  @keyframes pgmove{0%{margin-left:-35%}100%{margin-left:100%}}
  .btn.is-busy{opacity:.75;cursor:progress;}
  .btn .bs{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;animation:spin .7s linear infinite;}
  .badge{display:inline-block;min-width:17px;height:17px;padding:0 5px;background:var(--danger);color:#fff;border-radius:9px;font-size:11px;line-height:17px;text-align:center;margin-left:5px;}
  /* 布局 */
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:236px;background:#1c1c1c;color:#fff;flex-shrink:0;display:flex;flex-direction:column;}
  .sidebar .brand{padding:20px 22px;font-size:17px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar .brand small{display:block;font-size:11px;font-weight:400;color:var(--gray-300);margin-top:3px;}
  .nav{padding:12px 0;flex:1;overflow-y:auto;}
  .nav-group{padding:14px 22px 6px;font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;}
  .nav-item{padding:10px 22px;cursor:pointer;font-size:14px;color:var(--gray-300);display:flex;align-items:center;gap:10px;transition:.12s;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--primary);color:#fff;}
  .side-foot{padding:14px 22px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--gray-400);}
  .side-foot button{margin-top:8px;}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex-shrink:0;}
  .topbar .title{font-size:17px;font-weight:700;}
  .topbar .who{font-size:13px;color:var(--gray-500);}
  .content{padding:26px;overflow-y:auto;flex:1;}
  /* 卡片/表格 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
  .stat{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:18px 20px;}
  .stat .l{font-size:13px;color:var(--gray-500);}
  .stat .v{font-size:26px;font-weight:700;margin-top:6px;}
  .stat .s{font-size:12px;color:var(--gray-500);margin-top:4px;}
  .stat.acc .v{color:#dc2626;} .stat.warn .v{color:#d97706;}
  .comm-tabs{display:flex;gap:6px;border-bottom:1px solid var(--gray-200);margin-bottom:14px;}
  .comm-tab{padding:9px 16px;font-size:14px;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;}
  .comm-tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}
  .comm-desktop{display:block;}
  .comm-mobile{display:none;}
  .comm-table th,.comm-table td{font-variant-numeric:tabular-nums;}
  .comm-m-card{border:1px solid var(--gray-200);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;}
  .comm-m-card .m-from{font-weight:600;margin-bottom:8px;word-break:break-all;}
  .comm-m-card .m-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;}
  .comm-m-card .m-row span:first-child{color:var(--gray-500);}
  .panel{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:20px;margin-bottom:20px;}
  .panel h3{font-size:15px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--gray-100);}
  th{background:var(--gray-50);color:var(--gray-500);font-weight:600;font-size:12px;}
  tr:hover td{background:var(--gray-50);}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag-a{background:#dcfce7;color:var(--success);}
  .tag-f{background:#fee2e2;color:var(--danger);}
  .tag-p{background:#fef9c3;color:#a16207;}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .row .field{flex:1;min-width:180px;}
  .hint{font-size:12px;color:var(--gray-500);margin-top:8px;line-height:1.7;}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-mask.show{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:24px;width:420px;max-width:92vw;}
  .modal h3{margin-bottom:16px;}
  .toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:var(--gray-900);color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .copy{cursor:pointer;color:var(--primary);font-size:12px;}
  /* Telegram 客服插件 */
  .tg-fab{position:fixed;right:22px;bottom:22px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
  .tg-fab .ico{width:56px;height:56px;border-radius:50%;background:#2aabee;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(42,171,238,.45);transition:.15s;}
  .tg-fab:hover .ico{transform:scale(1.06);}
  .tg-fab .ico svg{width:30px;height:30px;fill:#fff;}
  .tg-fab .lb{background:var(--gray-900);color:#fff;font-size:12px;padding:4px 12px;border-radius:14px;white-space:nowrap;}
  .tg-card{position:fixed;right:22px;bottom:96px;z-index:81;width:330px;max-width:calc(100vw - 32px);background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.22);overflow:hidden;display:none;}
  .tg-card.show{display:block;animation:tgup .18s ease-out;}
  @keyframes tgup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .tg-card .hd{background:#2aabee;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;}
  .tg-card .av{width:46px;height:46px;border-radius:50%;background:#0f172a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;}
  .tg-card .nm{font-size:16px;font-weight:700;}
  .tg-card .id{font-size:12.5px;opacity:.9;margin-top:2px;}
  .tg-card .bd{padding:16px 18px;font-size:13px;color:var(--gray-700);line-height:2;}
  .tg-card .bd b{color:var(--gray-900);}
  .tg-card .ft{padding:0 18px 18px;}
  .tg-card .send{display:block;text-align:center;background:#2aabee;color:#fff;padding:12px;border-radius:10px;font-weight:700;font-size:14px;}
  .tg-card .send:hover{background:#1d96d8;}
  .tg-card .x{position:absolute;top:10px;right:12px;color:rgba(255,255,255,.85);cursor:pointer;font-size:17px;line-height:1;}
  /* 语言切换 */
  .lang-sw{display:inline-flex;border:1px solid var(--gray-300);border-radius:8px;overflow:hidden;}
  .lang-sw span{padding:5px 12px;font-size:12px;cursor:pointer;color:var(--gray-500);background:#fff;}
  .lang-sw span.active{background:var(--primary);color:#fff;font-weight:600;}
  /* 移动端适配 */
  .menu-btn{display:none;background:none;border:none;font-size:21px;cursor:pointer;color:var(--gray-700);padding:4px 8px;}
  .side-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;display:none;}
  .side-mask.show{display:block;}
  @media(max-width:860px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:.2s;}
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:block;}
    .content{padding:14px;}
    .topbar{padding:0 12px;}
    .prods{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
    .panel{padding:14px;}
    .row .field{min-width:100%;}
    .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
    .panel{overflow-x:auto;}
    table{min-width:560px;}
    .paybox{max-width:100%;}
    .tg-fab{right:14px;bottom:14px;}
    .tg-card{right:12px;bottom:86px;}
    .comm-desktop{display:none;}
    .comm-mobile{display:block;}
    .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
    .stat{padding:14px;}
    .stat .v{font-size:20px;}
  }

.tag-paid{background:#e7f6ec;color:#1a7f37;}
.shop-hero{background:#111827;color:#fff;border-radius:14px;padding:34px 30px;margin-bottom:18px;}
.shop-hero h1{margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:.3px}
.shop-hero p{margin:0 0 18px;opacity:.78;font-size:14px;line-height:1.6}
.shop-hero .cta{display:inline-block;background:#fff;color:#111827;border:none;border-radius:9px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.shop-notice{display:flex;align-items:center;gap:8px;background:#fff7e6;border:1px solid #ffe0a3;color:#8a5a00;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:18px}
.svc-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 6px}
.svc{display:flex;gap:10px;align-items:flex-start;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:12px 14px}
.svc .ic{width:30px;height:30px;border-radius:8px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.svc b{display:block;font-size:13px;font-weight:600}
.svc span{font-size:12px;color:var(--gray-500)}
.site-foot{margin-top:26px;border-top:1px solid var(--gray-200);padding:22px 0 8px;color:var(--gray-500);font-size:12px;line-height:1.9}
.site-foot b{color:var(--gray-800);font-size:13px}
.odr-tl{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.odr-tl .step{flex:1;min-width:118px;border-radius:10px;padding:10px 12px;border:1px solid var(--gray-200);background:#fff}
.odr-tl .step.done{border-color:#bfe3cd;background:#f2fbf6}
.odr-tl .step.cur{border-color:#f0c98a;background:#fffaf0}
.odr-tl .step b{display:block;font-size:13px;font-weight:600}
.odr-tl .step span{font-size:11px;color:var(--gray-500)}
.odr-total{margin-left:auto;width:100%;max-width:290px}
.odr-total .r{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--gray-500)}
.odr-total .r.big{border-top:1px solid var(--gray-200);margin-top:6px;padding-top:10px;color:var(--gray-800);font-size:16px;font-weight:700}

/* ===== 顶峰商城 · 高端商城主题（对标 BeikeShop 商务风格）===== */
:root{
  --brand:#fd560f; --brand-d:#dc4a0c; --brand-l:#fff2ec;
  --ink:#1c1c1c; --ink-2:#4b566b; --ink-3:#848484;
  --line:#e7e7e7; --line-2:#efefef;
  --bg:#fff; --bg-2:#f7f8fa; --bg-3:#f5f5f5;
  --radius:10px;
  --shadow-s:0 6px 18px rgba(0,0,0,.07);
  --shadow-m:0 10px 25px rgba(0,0,0,.10);
  --shadow-l:0 18px 50px rgba(0,0,0,.16);
  --topH:38px;
}
body{background:var(--bg-2);color:var(--ink);}

/* ---------- 顶部细条 ---------- */
.hd-top{background:#f7f8fa;border-bottom:1px solid #e5e5e5;height:var(--topH);display:flex;align-items:center;font-size:12.5px;color:var(--ink-2);}
.hd-top .wrap{max-width:1280px;margin:0 auto;padding:0 20px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.hd-top .l,.hd-top .r{display:flex;align-items:center;gap:18px;}
.hd-top a{color:var(--ink-2);cursor:pointer;}
.hd-top a:hover{color:var(--brand);}
.hd-top .sep{width:1px;height:13px;background:#ddd;}
.hd-top select{padding:3px 7px;border:1px solid #ddd;border-radius:6px;font-size:12px;background:#fff;outline:none;cursor:pointer;color:var(--ink-2);}

/* ---------- 主头部 ---------- */
.hd-main{background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:60;}
.hd-main .wrap{max-width:1280px;margin:0 auto;padding:0 20px;height:76px;display:flex;align-items:center;gap:26px;}
.hd-logo{display:flex;align-items:center;gap:11px;cursor:pointer;flex-shrink:0;}
.hd-logo .mk{width:42px;height:42px;border-radius:11px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;letter-spacing:.5px;}
.hd-logo .tx b{display:block;font-size:17px;font-weight:800;letter-spacing:.6px;line-height:1.2;}
.hd-logo .tx span{font-size:10.5px;color:var(--ink-3);letter-spacing:1.6px;text-transform:uppercase;}
.hd-nav{display:flex;align-items:center;gap:2px;flex:1;}
.hd-nav a{padding:9px 15px;font-size:14.5px;color:var(--ink);cursor:pointer;border-radius:8px;font-weight:500;position:relative;white-space:nowrap;}
.hd-nav a:hover,.hd-nav a.on{color:var(--brand);}
.hd-nav a.on:after{content:"";position:absolute;left:15px;right:15px;bottom:2px;height:2px;background:var(--brand);border-radius:2px;}
.hd-act{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.hd-ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.15s;border:1px solid transparent;}
.hd-ico:hover{background:var(--bg-3);border-color:var(--line);}
.hd-ico svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.hd-ico .n{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;background:var(--brand);color:#fff;border-radius:9px;font-size:10.5px;line-height:17px;text-align:center;font-weight:700;}
.hd-menu{position:absolute;top:46px;right:0;background:#fff;border-radius:12px;box-shadow:var(--shadow-m);padding:7px;min-width:172px;display:none;z-index:70;}
.hd-menu.show{display:block;}
.hd-menu a{display:block;padding:9px 13px;border-radius:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer;}
.hd-menu a:hover{background:var(--bg-3);color:var(--brand);}
.hd-menu .hdline{height:1px;background:var(--line-2);margin:5px 8px;}

/* ---------- 轮播 Hero ---------- */
.hero{position:relative;overflow:hidden;background:#111;height:470px;min-height:470px;}
.hero .sl{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:flex;align-items:center;visibility:hidden;}
.hero .sl.on{opacity:1;visibility:visible;}
.hero .sl .bg{position:absolute;inset:-2%;background-repeat:no-repeat;background-size:cover;background-position:50% 50%;transform:scale(1.02);}
.hero.kb .sl.on .bg{animation:heroKB 9s ease-out forwards;}
.hero .sl .scrim{position:absolute;inset:0;background:linear-gradient(96deg,rgba(8,8,10,.90) 0%,rgba(8,8,10,.72) 34%,rgba(8,8,10,.34) 62%,rgba(8,8,10,.10) 100%),linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,.34) 100%);}
@keyframes heroKB{from{transform:scale(1.02)}to{transform:scale(1.10)}}
@keyframes heroBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero .in{position:relative;z-index:3;max-width:1280px;margin:0 auto;padding:0 20px;width:100%;color:#fff;}
.hero .in>*{animation:heroUp .75s cubic-bezier(.22,.8,.28,1) both;}
.hero .in>h1{animation-delay:.07s;} .hero .in>p{animation-delay:.14s;} .hero .in>.cta{animation-delay:.2s;}
.hero.sl-on .in>*{animation-play-state:running;}
@keyframes heroUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.hero .sub{display:inline-flex;align-items:center;gap:12px;font-size:13px;letter-spacing:5.5px;text-transform:uppercase;color:#ffb391;margin-bottom:18px;font-weight:600;}
.hero .sub:before{content:"";width:34px;height:2px;background:var(--brand);border-radius:2px;}
.hero h1{font-size:56px;line-height:1.08;font-weight:800;margin-bottom:18px;letter-spacing:-.5px;max-width:660px;text-shadow:0 2px 26px rgba(0,0,0,.5);}
.hero p{font-size:16.5px;color:rgba(255,255,255,.82);margin-bottom:32px;max-width:500px;line-height:1.72;}
.hero .cta{display:inline-block;background:var(--brand);color:#fff;border:2px solid var(--brand);padding:15px 42px;font-size:13.5px;font-weight:700;letter-spacing:1.4px;cursor:pointer;font-family:inherit;transition:.2s;text-transform:uppercase;border-radius:2px;box-shadow:0 10px 24px rgba(253,86,15,.34);}
.hero .cta:hover{background:#fff;color:var(--brand-d);border-color:#fff;box-shadow:0 14px 32px rgba(255,255,255,.22);transform:translateY(-2px);}
.hero .dots{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:11px;z-index:6;}
.hero .dots i{width:46px;height:4px;border-radius:2px;background:rgba(255,255,255,.30);cursor:pointer;transition:.2s;overflow:hidden;display:block;}
.hero .dots i:hover{background:rgba(255,255,255,.5);}
.hero .dots i b{display:block;height:100%;width:100%;background:var(--brand);transform:scaleX(0);transform-origin:left;}
.hero .dots i.on b{animation:heroBar 5.2s linear forwards;}
.hero .arrow{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.28);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:6;transition:.2s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;}
.hero:hover .arrow{opacity:1;}
.hero .arrow:hover{background:var(--brand);color:#fff;border-color:var(--brand);}
.hero .arrow.l{left:22px;} .hero .arrow.r{right:22px;}

/* ---------- 滚动公告 ---------- */
.roll{background:#fff;border-bottom:1px solid var(--line-2);height:44px;display:flex;align-items:center;overflow:hidden;}
.roll .wrap{max-width:1280px;margin:0 auto;padding:0 20px;width:100%;display:flex;align-items:center;gap:12px;}
.roll .tg{background:var(--brand-l);color:var(--brand);font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;flex-shrink:0;}
.roll .tx{flex:1;overflow:hidden;white-space:nowrap;font-size:13.5px;color:var(--ink-2);}

/* ---------- 内容容器 ---------- */
.sec{max-width:1280px;margin:0 auto;padding:0 20px;}
.sec-hd{text-align:center;padding:56px 0 34px;}
.sec-hd h2{font-size:30px;font-weight:800;color:#333;letter-spacing:.5px;margin-bottom:12px;}
.sec-hd .ln{width:54px;height:5px;margin:0 auto;border-radius:3px;background:var(--brand);}
.sec-hd p{color:var(--ink-3);font-size:14px;margin-top:12px;}
.card-w{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-s);}

/* ---------- 商品网格 ---------- */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;}
.pcard{background:#fff;border-radius:var(--radius);overflow:hidden;transition:.28s cubic-bezier(.22,.8,.28,1);cursor:pointer;border:1px solid transparent;position:relative;}
.pcard:hover{box-shadow:var(--shadow-m);border-color:var(--line);transform:translateY(-4px);}
.pcard .im{position:relative;overflow:hidden;background:var(--bg-3);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
.pcard .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease-out;}
.pcard:hover .im img{transform:scale(1.06);}
.pcard .acts{position:absolute;left:0;right:0;bottom:-44px;display:flex;opacity:0;transition:.22s ease-in-out;z-index:3;}
.pcard:hover .acts{bottom:0;opacity:1;}
.pcard .acts button{flex:1;background:#111;color:#fff;border:none;border-right:1px solid #333;padding:12px 4px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.pcard .acts button:last-child{border-right:none;flex:0 0 46px;}
.pcard .acts button:hover{background:#464646;}
.pcard .bd{padding:15px 15px 17px;}
.pcard .rt{display:flex;align-items:center;gap:6px;margin-bottom:9px;font-size:11.5px;color:#c9c9c9;}
.pcard .rt .st{color:#ffb400;font-size:11px;letter-spacing:.6px;}
.pcard .rt .sd{color:var(--brand);font-weight:700;}
.pcard .rt .sp{flex:1;}
.pcard .rt .sl2{color:var(--ink-3);background:var(--bg-3);padding:2px 8px;border-radius:20px;font-size:11px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pcard .pr .off{background:var(--brand-l);color:var(--brand);font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;margin-left:auto;}
.pcard .nm{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:8px;line-height:1.45;height:39px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.pcard .pr{display:flex;align-items:baseline;gap:8px;}
.pcard .pr .nw{color:var(--brand);font-size:17px;font-weight:800;}
.pcard .pr .od{color:#bbb;font-size:12.5px;text-decoration:line-through;}
.pcard .mt{font-size:12px;color:var(--ink-3);margin-top:7px;display:flex;justify-content:space-between;gap:8px;}
.pcard .wish{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:4;transition:.15s;}
.pcard .wish:hover{background:var(--brand);color:#fff;}

/* ---------- 分类胶囊 ---------- */
.catbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:32px;}
.catbar span{padding:8px 22px;border:2px solid transparent;border-radius:50px;font-size:13.5px;color:#6c757d;cursor:pointer;transition:.16s;background:#fff;box-shadow:var(--shadow-s);}
.catbar span:hover{color:var(--brand);}
.catbar span.on{color:#fff;background:var(--brand);box-shadow:0 6px 16px rgba(253,86,15,.28);}

/* ---------- 工具栏（搜索） ---------- */
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px;background:#fff;border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow-s);}
.toolbar .srch{flex:1;min-width:230px;display:flex;gap:0;}
.toolbar .srch input{flex:1;padding:11px 16px;border:1px solid var(--line);border-right:none;border-radius:8px 0 0 8px;font-size:14px;outline:none;font-family:inherit;}
.toolbar .srch input:focus{border-color:var(--brand);}
.toolbar .srch button{padding:11px 26px;background:var(--ink);color:#fff;border:none;border-radius:0 8px 8px 0;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.toolbar .srch button:hover{background:var(--brand);}
.toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;background:#fff;cursor:pointer;color:var(--ink-2);font-family:inherit;}
.toolbar .cnt{font-size:13px;color:var(--ink-3);}

/* ---------- 双列 Banner ---------- */
.dbl{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:0 auto;max-width:1280px;padding:0 20px;}
.dbl .bx{position:relative;height:250px;border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;padding:34px 38px;color:#fff;cursor:pointer;box-shadow:var(--shadow-s);transition:.25s ease-out;}
.dbl .bx:hover{box-shadow:var(--shadow-m);transform:translateY(-3px);}
.dbl .bx:before{content:"";position:absolute;inset:0;background:linear-gradient(88deg,rgba(8,8,10,.82) 0%,rgba(8,8,10,.52) 46%,rgba(8,8,10,.08) 100%);z-index:2;}
.dbl .bx .bxbg{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;transition:transform .5s ease-out;z-index:1;}
.dbl .bx:hover .bxbg{transform:scale(1.07);}
.dbl .bx .c{position:relative;z-index:2;}
.dbl .bx b{display:block;font-size:24px;font-weight:800;margin-bottom:10px;}
.dbl .bx p{font-size:13.5px;opacity:.86;margin-bottom:18px;max-width:280px;line-height:1.6;}
.dbl .bx .go{display:inline-block;background:#fff;color:var(--ink);padding:10px 24px;font-size:12.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}

/* ---------- 服务保障条 ---------- */
.svcs{background:#fff;border-top:1px solid var(--line-2);margin-top:64px;}
.svcs .wrap{max-width:1280px;margin:0 auto;padding:34px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
.svcs .it{display:flex;align-items:center;gap:15px;padding:6px 4px;transition:.2s;}
.svcs .it:hover{transform:translateY(-2px);}
.svcs .ic{width:50px;height:50px;border-radius:14px;background:var(--brand-l);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;}
.svcs .it:hover .ic{background:var(--brand);color:#fff;}
.svcs .ic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.svcs b{display:block;font-size:14.5px;font-weight:700;color:#222;margin-bottom:4px;letter-spacing:.2px;}
.svcs span{font-size:12.5px;color:var(--ink-3);line-height:1.5;}

/* ---------- 页脚 ---------- */
.foot{background:#1c1c1c;color:#9d9d9d;padding:52px 0 0;margin-top:0;}
.foot .wrap{max-width:1280px;margin:0 auto;padding:0 20px;}
.foot .cols{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.3fr;gap:34px;padding-bottom:40px;}
.foot h4{color:#fff;font-size:14.5px;font-weight:700;margin-bottom:18px;letter-spacing:.4px;}
.foot .intro{font-size:13px;line-height:1.9;margin-bottom:18px;}
.foot ul{list-style:none;}
.foot li{margin-bottom:11px;}
.foot a{color:#9d9d9d;font-size:13px;cursor:pointer;transition:.15s;}
.foot a:hover{color:var(--brand);}
.foot .soc{display:flex;gap:10px;}
.foot .soc i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;font-style:normal;color:#ccc;transition:.15s;}
.foot .soc i:hover{background:var(--brand);color:#fff;}
.foot .bot{border-top:1px solid rgba(255,255,255,.09);padding:20px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;}
.foot .pay{display:flex;gap:8px;align-items:center;}
.foot .pay i{height:26px;padding:0 10px;border-radius:5px;background:rgba(255,255,255,.92);color:#1a1f71;font-size:10.5px;font-weight:800;font-style:normal;display:flex;align-items:center;letter-spacing:.4px;}


/* ---------- 登录 / 注册页（对标 BeikeShop） ---------- */
.auth-hero{text-align:center;padding:38px 20px 30px;}
.auth-hero h1{font-size:27px;font-weight:700;color:#333;letter-spacing:.5px;}
.auth-body{max-width:1280px;margin:0 auto;padding:0 20px 70px;}
.auth-split{display:flex;gap:0;justify-content:center;align-items:flex-start;}
.auth-vr{width:1px;background:#e6e6e6;align-self:stretch;margin:0 34px;}
.auth-panel{width:376px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.auth-panel .hd{background:#fafafa;border-bottom:1px solid #f0f0f0;padding:15px 22px;font-size:14px;font-weight:700;color:#333;}
.auth-panel .bd{padding:24px 22px 26px;}
.auth-panel .field{margin-bottom:18px;}
.auth-panel .field label{display:block;font-size:13px;color:#4b566b;margin-bottom:8px;font-weight:400;}
.req{color:var(--brand);margin-right:3px;font-weight:700;}
.auth-panel .field input{width:100%;padding:11px 13px;border:1px solid #dfe3e8;border-radius:6px;font-size:14px;outline:none;transition:.15s;font-family:inherit;color:#1c1c1c;}
.auth-panel .field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(253,86,15,.1);}
.auth-btn{width:100%;padding:13px;background:#111;color:#fff;border:1px solid #111;font-size:14.5px;font-weight:700;cursor:pointer;letter-spacing:1px;font-family:inherit;transition:.18s;border-radius:4px;margin-top:4px;}
.auth-btn:hover{background:var(--brand);border-color:var(--brand);}
.auth-panel .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#6c757d;margin:-4px 0 20px;cursor:pointer;}
.auth-panel .chk input{width:auto;}
.auth-panel .msg{margin-top:14px;}
.auth-panel .msg.err,.auth-panel .msg.ok{display:block;padding:10px 12px;border-radius:6px;font-size:13px;}
@media(max-width:860px){
  .auth-split{flex-direction:column;align-items:center;}
  .auth-vr{display:none;}
  .auth-panel{width:100%;max-width:400px;}
}

/* ---------- 面包屑 ---------- */
.crumb{background:#fff;border-bottom:1px solid var(--line-2);padding:15px 0;font-size:13px;color:var(--ink-3);}
.crumb .wrap{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:9px;align-items:center;}
.crumb a{color:var(--ink-3);cursor:pointer;}
.crumb a:hover{color:var(--brand);}
.crumb .sp{color:#ccc;}

/* ---------- 内容页标题 ---------- */
.page-hd{text-align:center;padding:42px 0 26px;}
.page-hd h1{font-size:26px;font-weight:800;color:#333;letter-spacing:.4px;}

@media(max-width:1100px){
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .foot .cols{grid-template-columns:1fr 1fr 1fr;}
}
@media(max-width:860px){
  .hd-nav{display:none;}
  .hd-main .wrap{height:62px;gap:12px;}
  .hero{height:300px;}
  .hero h1{font-size:30px;}
  .hero p{font-size:14px;}
  .hero .arrow{display:none;}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .dbl{grid-template-columns:1fr;padding:0 14px;}
  .svcs .wrap{grid-template-columns:1fr 1fr;gap:16px;}
  .foot .cols{grid-template-columns:1fr 1fr;gap:24px;}
  .sec{padding:0 14px;}
  .sec-hd{padding:36px 0 22px;}
  .sec-hd h2{font-size:22px;}
  .hd-top .l{display:none;}
}
@media(max-width:520px){
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .foot .cols{grid-template-columns:1fr;}
  .svcs .wrap{grid-template-columns:1fr;}
}


/* ===== Phase J 美化补丁 ===== */
.hd-logo .mk{background:linear-gradient(135deg,var(--brand),var(--brand-d));box-shadow:0 6px 16px rgba(253,86,15,.3);}
.hd-top{background:linear-gradient(90deg,#fafafa,#f7f8fa);}
.roll .tg{background:var(--brand);color:#fff;}
.roll{box-shadow:0 1px 0 rgba(0,0,0,.02);}
.sec-hd h2{position:relative;}
.sec-hd h2:after{content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:54px;height:5px;border-radius:3px;background:var(--brand);}
.sec-hd .ln{display:none;}
.sec-hd{padding:60px 0 40px;}
.card-w{box-shadow:var(--shadow-s);}
button.cta,.btn{transition:.2s;}
.toolbar{box-shadow:var(--shadow-s);border:1px solid var(--line-2);}
.pgrid{gap:24px;}
.foot{background:linear-gradient(180deg,#1c1c1c,#141414);}
.foot h4:after{content:"";display:block;width:26px;height:3px;background:var(--brand);border-radius:2px;margin-top:11px;}
.foot h4{margin-bottom:22px;}
.foot .bot{border-top:1px solid rgba(255,255,255,.09);}
::selection{background:var(--brand);color:#fff;}
/* 滚动条 */
.sec ::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#f1f1f1;}
::-webkit-scrollbar-thumb{background:#cfcfcf;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--brand);}
/* 移动端 hero 适配 */
@media(max-width:860px){
  .hero{height:330px;min-height:330px;}
  .hero h1{font-size:30px;letter-spacing:0;}
  .hero p{font-size:13.5px;margin-bottom:22px;}

function parseAddr(s) {
  try { const o = JSON.parse(s); if (o && typeof o === 'object') return o; } catch (e) {}
  return { detail: (s || '').trim() };
}
function stateFieldHTML(prefix, country, current) {
  const states = COUNTRY_STATES[country];
  if (states && states.length) {
    return `<select id="${prefix}-state">${states.map(s => `<option value="${s}" ${s === current ? 'selected' : ''}>${stateLabel(s)}</option>`).join('')}</select>`;
  }
  return `<input id="${prefix}-state-text" value="${esc(current || '')}" placeholder="${t('州/省/地区（自由填写）')}">`;
}
function addrForm(prefix, saved) {
  const a = parseAddr(saved || '');
  const country = a.country || COUNTRIES[0];
  return `<div class="row">
    <div class="field"><label>${t('国家/地区')}</label><select id="${prefix}-country" onchange="renderState('${prefix}')">${COUNTRIES.map(x => `<option value="${x}" ${x === country ? 'selected' : ''}>${countryLabel(x)}</option>`).join('')}</select></div>
    <div class="field" id="${prefix}-statewrap"><label>${t('州/省')}</label>${stateFieldHTML(prefix, country, a.state)}</div>
  </div>
  <div class="row">
    <div class="field"><label>${t('城市')}</label><input id="${prefix}-city" value="${esc(a.city || '')}" placeholder="${t('城市')}"></div>
    <div class="field"><label>${t('邮编')}</label><input id="${prefix}-postal" value="${esc(a.postal || '')}" placeholder="${t('邮编')}"></div>
  </div>
  <div class="field"><label>${t('街道地址')}</label><input id="${prefix}-detail" value="${esc(a.detail || '')}" placeholder="${t('街道/门牌号等')}"></div>
  <div class="field"><label>${t('邮箱')}</label><input id="${prefix}-email" type="email" value="${esc(a.email || '')}" placeholder="name@example.com"></div>`;
}
function renderState(prefix) {
  const el = document.getElementById(prefix + '-statewrap');
  if (!el) return;
  const country = v(prefix + '-country');
  const prev = v(prefix + '-state') || v(prefix + '-state-text') || '';
  el.innerHTML = `<label>${t('州/省')}</label>${stateFieldHTML(prefix, country, prev)}`;
}
function collectAddr(prefix) {
  const o = {
    country: v(prefix + '-country'),
    state: v(prefix + '-state') || v(prefix + '-state-text') || '',
    city: v(prefix + '-city') || '',
    detail: v(prefix + '-detail') || '',
    postal: v(prefix + '-postal') || '',
    email: v(prefix + '-email') || ''
  };
  const parts = [countryLabel(o.country), stateLabel(o.state), o.city, o.detail].map(x => (x || '').trim()).filter(Boolean);
  let s = parts.join(' ');
  if (o.postal) s += '  ' + t('邮编') + ':' + o.postal;
  if (o.email) s += '  ' + t('邮箱') + ':' + o.email;
  return s.trim();
}
function collectAddrJSON(prefix) {
  return JSON.stringify({
    country: v(prefix + '-country'),
    state: v(prefix + '-state') || v(prefix + '-state-text') || '',
    city: v(prefix + '-city') || '',
    detail: v(prefix + '-detail') || '',
    postal: v(prefix + '-postal') || '',
    email: v(prefix + '-email') || ''
  });
}
// 提现详情窗口（含驳回原因）
function wdDetail(id, status, reason) {
  openModal(`<h3>${t('提现详情')} #${id}</h3>
    <div class="field"><label>${t('状态')}</label><input value="${esc(status)}" disabled></div>
    ${reason ? `<div class="field"><label>${t('驳回原因')}</label><textarea disabled style="width:100%;padding:11px 12px;border:1px solid var(--gray-300);border-radius:9px;font-size:14px;min-height:72px;resize:none;background:#fff;color:var(--gray-700)">${esc(reason)}</textarea></div>` : `<p class="hint">${t('暂无驳回原因')}</p>`}`);
}

function setLang(l) {
  LANG = l; localStorage.setItem('fx_lang', l);

  applyTgLang();
  render();
}

}

function logout() { if (_adminWs) { try { _adminWs.close(); } catch (e) {} _adminWs = null; } localStorage.clear(); USER = null; location.hash = 'login'; render(); }

// ---------- 后台实时订单推送（WebSocket）----------
let _adminWs = null;
function connectAdminWs() {
  if (!(USER && USER.role === 'admin') || _adminWs) return;
  try {
    const token = localStorage.getItem('fx_token');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + encodeURIComponent(token));
    _adminWs = ws;
    ws.onopen = () => { const d = document.getElementById('ws-dot'); if (d) d.style.background = '#16a34a'; };
    ws.onclose = () => { _adminWs = null; const d = document.getElementById('ws-dot'); if (d) d.style.background = '#cbd5e1'; setTimeout(() => { if (USER && USER.role === 'admin') connectAdminWs(); }, 3000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'paid_order' || msg.type === 'new_order') {
          const o = msg.order || {};
          toast((msg.type === 'paid_order' ? 'New payment received: ' : 'New order placed: ') + (o.order_no || ('#' + o.id)) + ' · ' + money(o.amount));
          if (location.hash.indexOf('admin-orders') >= 0) loadPage('admin-orders');
          if (location.hash.indexOf('admin-dash') >= 0) loadPage('admin-dash');
        }
      } catch (e) {}
    };
  } catch (e) { _adminWs = null; }
}

const ROLE_HOME = { admin: 'admin-dash', agent: 'shop', fx: 'shop' };
async function render() {
  const user = JSON.parse(localStorage.getItem('fx_user') || 'null');

  if (hash === 'login') { return showAuth('login'); }

  showApp(hash);
}

async function doLogin() {
  const username = document.getElementById('lg-u').value.trim();
  const password = document.getElementById('lg-p').value;
  const msg = document.getElementById('lg-msg');
  msg.className = 'msg';
  if (!username || !password) { msg.className = 'msg err'; msg.textContent = t('请输入账号和密码'); return; }
  try {
    const r = await API('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    if (!r.success) { msg.className = 'msg err'; msg.textContent = r.error; return; }
    setSession(r.token, r.user);
    msg.className = 'msg ok'; msg.textContent = t('登录成功，正在进入…');
    location.hash = ROLE_HOME[r.user.role];
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
}

/* 注册页已合并进 showAuth 的右侧卡片 */

async function doRegister() {
  const username = document.getElementById('rg-u').value.trim();
  const nickname = document.getElementById('rg-n').value.trim();
  const password = document.getElementById('rg-p').value;
  const password2 = document.getElementById('rg-p2').value;
  const ref = document.getElementById('rg-ref').value.trim();
  const msg = document.getElementById('rg-msg');
  msg.className = 'msg';
  if (!username || !password) { msg.className = 'msg err'; msg.textContent = t('邮箱和密码必填'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username)) { msg.className = 'msg err'; msg.textContent = t('请输入正确的邮箱地址'); return; }
  if (password.length < 6) { msg.className = 'msg err'; msg.textContent = t('密码至少 6 位'); return; }
  if (password !== password2) { msg.className = 'msg err'; msg.textContent = t('两次密码不一致'); return; }
  if (!ref) { msg.className = 'msg err'; msg.textContent = t('请填写邀请码（无邀请码无法注册）'); return; }
  try {
    const r = await API('/api/auth/register', { method: 'POST', body: JSON.stringify({ username, password, nickname, ref }) });
    if (!r.success) { msg.className = 'msg err'; msg.textContent = r.error; return; }
    msg.className = 'msg ok'; msg.textContent = t('注册成功！请直接用该邮箱登录');
    // 清空注册表单并把邮箱回填到左侧登录框
    ['rg-n', 'rg-p', 'rg-p2'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    const lu = document.getElementById('lg-u');
    if (lu) { lu.value = username; document.getElementById('lg-p').focus(); }
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
}

function copyInvite(code) {
  const done = () => toast(t('已复制') + ' ' + code);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, () => fallbackCopy(code, done));
      return;
    }
  } catch (e) {}
  fallbackCopy(code, done);
}
function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast(txt); }
  document.body.removeChild(ta);
}

function fmtCard(el) {
  const v = el.value.replace(/\D/g, '').slice(0, 19);
  el.value = v.replace(/(.{4})/g, '$1 ').trim();
}
// 有效期自动补「/」：只留数字，满 3 位即插入分隔符 —— 与 cardpay.html 规则一致
//   输入 1 0 2 6  ->  1  10  10/2  10/26
function fmtExp(el) {
  const raw = String(el.value || '').replace(/\D/g, '').slice(0, 4);
  el.value = raw.length >= 2
    ? raw.substring(0, 2) + (raw.length > 2 ? '/' + raw.substring(2, 4) : '')
    : raw;
}
// 失焦修补：单月缺前导 0（"4" -> "04"）；
//   三位数只有在前两位不构成合法月份时才按「单月+两位年」解读（"430" -> "04/30"），
//   否则原样保留 —— "10/2" 是用户还没输完，不该被改写成 "01/02"。
function fixExp(el) {
  const d = String(el.value || '').replace(/\D/g, '');
  if (d.length === 1) { el.value = '0' + d; return; }
  if (d.length === 3) {
    const t = Number(d.substring(0, 2));
    if (!(t >= 1 && t <= 12)) el.value = '0' + d.charAt(0) + '/' + d.substring(1);
  }
}
// 提交前统一成 MM/YY（后端要求严格两位月 + 两位年）
//   带分隔符 → 按分隔符切；纯数字 4 位 → 两位两位切；纯数字 3 位且前两位非法月份 → 单月+两位年
function normExp(v) {
  const s = String(v == null ? '' : v).trim();
  const m = /^(\d{1,2})\s*[\/\-\s.]\s*(\d{1,4})$/.exec(s);
  if (m) {
    const mm = m[1].length === 1 ? '0' + m[1] : m[1];
    let yy = m[2].length > 2 ? m[2].slice(-2) : m[2];
    if (yy.length === 1) yy = '0' + yy;
    return mm + '/' + yy;
  }
  const d = s.replace(/\D/g, '');
  if (d.length === 4) return d.substring(0, 2) + '/' + d.substring(2);
  if (d.length === 3) {
    const t = Number(d.substring(0, 2));
    if (!(t >= 1 && t <= 12)) return '0' + d.charAt(0) + '/' + d.substring(1);
  }
  return s;   // 不完整或非法：原样交给后端报错，绝不猜
}
function pickPay(m) {
  if (m === 'usdt') return toast('This payment method is currently unavailable.');
  PAY_METHOD = m; loadPage('pay/' + location.hash.slice(1).split('/')[1]);
}
// 支付进行中标志：期间拦截关闭/刷新
let PAYING = false;
if (!window.__fxUnloadHook) {
  window.__fxUnloadHook = true;
  window.addEventListener('beforeunload', function (e) {
    if (PAYING) { e.preventDefault(); e.returnValue = ''; return ''; }
  });
}
function _payMask(on) {
  const m = document.getElementById('paying');
  if (m) m.classList.toggle('show', !!on);
  document.body.style.overflow = on ? 'hidden' : '';
}
async function doPay(id) {
  if (PAY_METHOD === 'usdt' || PAY_METHOD === 'alipay' || PAY_METHOD === 'wechat') {
    return toast('This payment method is currently unavailable.');
  }
  const body = { pay_method: PAY_METHOD };
  if (PAY_METHOD === 'visa' || PAY_METHOD === 'mastercard') {
    const cardNumber = (document.getElementById('pay-card').value || '').replace(/\s/g, '');
    const expiry = normExp(document.getElementById('pay-exp').value);
    const cvv = (document.getElementById('pay-cvv').value || '').replace(/\D/g, '');
    const cardholder = (document.getElementById('pay-holder').value || '').trim();
    if (!cardNumber || !expiry || !cvv || !cardholder) return toast('Please complete all card details.');
    body.card = { cardNumber, expiry, cvv, cardholder };
  }
  // 1) 立刻进入「正在支付」界面（转圈），再发请求 —— 用户点完就能看到反馈
  const payBtn = document.getElementById('pay-btn');
  const btnHTML = payBtn ? payBtn.innerHTML : '';
  PAYING = true;
  _payMask(true);
  if (payBtn) {
    payBtn.disabled = true;
    payBtn.classList.add('is-busy');
    payBtn.innerHTML = '<span class="bs"></span>' + t('正在支付…');
  }
  await new Promise(res => setTimeout(res, 60)); // 让遮罩先绘制出来
  // 2) 提交支付
  let r = { success: false, error: t('网络异常，请稍后重试') };
  try { r = await API('/api/orders/' + id + '/pay', { method: 'POST', body: JSON.stringify(body) }); }
  catch (e) { r = { success: false, error: (e && e.message) || t('网络异常，请稍后重试') }; }
  // 3) 结果出来前继续转圈，随机停留 10-20 秒
  const waitMs = Math.floor(Math.random() * 11 + 10) * 1000;
  await new Promise(res => setTimeout(res, waitMs));
  // 4) 收尾并回传结果
  PAYING = false;
  _payMask(false);
  if (payBtn) { payBtn.disabled = false; payBtn.classList.remove('is-busy'); payBtn.innerHTML = btnHTML; }
  if (!r.success) return toast(bankErr(r.error));
  toast('Payment successful. Commission has been settled.');
  location.hash = 'my-orders';
}

async function saveAddr(id) {

    <button class="arrow l" onclick="heroGo(-1)" aria-label="prev">‹</button>
    <button class="arrow r" onclick="heroGo(1)" aria-label="next">›</button>
    <div class="dots">${HERO_SLIDES.map((s, i) => `<i class="${i === 0 ? 'on' : ''}" onclick="heroTo(${i})"><b></b></i>`).join('')}</div>
  </div>`;
}
function heroTo(i) {
  const sl = document.querySelectorAll('#hero .sl'), dt = document.querySelectorAll('#hero .dots i');
  if (!sl.length) return;
  const old = HERO_I;
  HERO_I = (i + sl.length) % sl.length;
  sl.forEach((e, k) => e.classList.toggle('on', k === HERO_I));
  dt.forEach((e, k) => {
    e.classList.toggle('on', k === HERO_I);
    const b = e.querySelector('b');
    if (b) { b.style.animation = 'none'; void b.offsetWidth; b.style.animation = k === HERO_I ? 'heroBar 5.2s linear forwards' : 'none'; }
  });
  const hero = document.getElementById('hero');
  if (hero) hero.classList.toggle('kb', !!~String(old));   // enable slow ken-burns after first paint
}
function heroGo(d) { heroTo(HERO_I + d); heroAuto(); }
function heroAuto() {
  if (HERO_TM) clearInterval(HERO_TM);
  HERO_TM = setInterval(() => heroTo(HERO_I + 1), 5200);
}

/* 服务保障条 */
function svcIco(k) {
  const P = {
    truck: '<path d="M1 3h13v10H1z"/><path d="M14 7h4l3 3v3h-7z"/><circle cx="5.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
    back: '<path d="M3 10a7 7 0 1 1 2.2 5.1"/><path d="M3 4v5h5"/>',
    head: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2" y="13" width="4.5" height="6.5" rx="1.6"/><rect x="17.5" y="13" width="4.5" height="6.5" rx="1.6"/>',
    shield: '<path d="M12 2.5 20 6v6c0 5-3.4 8.6-8 9.5-4.6-.9-8-4.5-8-9.5V6z"/><path d="M8.6 12.2l2.4 2.4 4.4-4.6"/>'
  };
  return `<svg viewBox="0 0 24 24">${P[k] || ''}</svg>`;
}
function svcStrip() {
  const S = [
    ['truck', '多仓直发', '全球多仓协同，48 小时内出库'],
    ['back', '退换无忧', '7 天无理由退换，全程跟进'],
    ['head', '精致服务', '一对一客服，售前售后响应'],
    ['shield', '正品保障', '官方直采，假一赔十']
  ];
  return `<div class="svcs"><div class="wrap">${S.map(([i, b, s]) =>
    `<div class="it"><div class="ic">${svcIco(i)}</div><div class="tx"><b>${t(b)}</b><span>${t(s)}</span></div></div>`).join('')}</div></div>`;
}

/* 页脚 */

  const L3 = [['aftersale', '我的售后'], ['about', '配送信息'], ['about', '使用条款'], ['about', '隐私政策']];
  return `<div class="foot">

        <div>
          <h4>${t(BRAND_CN)}</h4>

          <div class="soc"><i>f</i><i>X</i><i>in</i><i>IG</i></div>
        </div>
        <div><h4>${t('关于我们')}</h4><ul>${L1.map(([k, n]) => `<li><a onclick="go('${k}')">${t(n)}</a></li>`).join('')}</ul></div>
        <div><h4>${t('会员中心')}</h4><ul>${L2.map(([k, n]) => `<li><a onclick="go('${k}')">${t(n)}</a></li>`).join('')}</ul></div>
        <div><h4>${t('其他')}</h4><ul>${L3.map(([k, n]) => `<li><a onclick="go('${k}')">${t(n)}</a></li>`).join('')}</ul></div>
        <div>
          <h4>${t('联系我们')}</h4>
          <ul>
            <li><a onclick="toggleTg(true)">${esc(TG_HANDLE || '@MementoCare')}</a></li>
            <li>${t('在线时间')}${t('：')}13:00 - 23:30</li>
            <li>support@peakmall.com</li>
          </ul>
        </div>
      </div>
      <div class="bot">
        <div>© ${new Date().getFullYear()} ${t(BRAND_CN)} · ${BRAND_EN}　All rights reserved.</div>
        <div class="pay"><i>VISA</i><i style="color:#eb001b">MasterCard</i></div>
      </div>
    </div>
  </div>`;
}

/* 商品卡 */
function prodCard(p) {
  const old = Number(p.price) * 2.5;
  return `<div class="pcard" onclick="go('product/${p.id}')">
    <div class="im">
      ${p.cover && (String(p.cover).indexOf('/uploads/') === 0 || String(p.cover).indexOf('http') === 0)
      ? `<img src="${esc(p.cover)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`
      : `<div style="font-size:52px">${esc(p.cover || '📦')}</div>`}
      <button class="wish" title="${t('收藏')}" onclick="event.stopPropagation();addWishQuick(${p.id},this)">☆</button>
      <div class="acts">
        <button onclick="event.stopPropagation();addCart(${p.id})">${t('加入购物车')}</button>
        <button title="${t('立即购买')}" onclick="event.stopPropagation();go('product/${p.id}')">${t('购买')}</button>
      </div>
    </div>
    <div class="bd">
      <div class="nm">${esc(p.name)}</div>
      <div class="rt"><span class="st">★★★★★</span><span class="sd">4.9</span><span class="sp"></span><span class="sl2">${esc(t(p.category) || '')}</span></div>
      <div class="pr"><span class="nw">${money(p.price)}</span><span class="od">${money(old)}</span><span class="off">-60%</span></div>
      <div class="mt"><span>${stockLabel(p.stock)}</span><span>${t('官方直采')}</span></div>
    </div>
  </div>`;
}
async function addWishQuick(pid, el) {
  try {
    const r = await API('/api/me/wishlist', { method: 'POST', body: JSON.stringify({ product_id: pid }) });
    if (!r.success) return toast(bankErr(r.error));
    if (el) { el.textContent = '★'; el.style.color = '#fd560f'; }
    toast('Added to wishlist');
  } catch (e) { toast('Failed, please sign in first'); }
}

/* 面包屑 */
function crumb(items) {
  return `<div class="crumb"><div class="wrap">
    <a onclick="go('shop')">${t('首页')}</a>
    ${items.map(([k, n]) => `<span class="sp">/</span>${k ? `<a onclick="go('${k}')">${t(n)}</a>` : `<span>${t(n)}</span>`}`).join('')}
  </div></div>`;
}
function pageHd(title, sub) {
  return `<div class="page-hd"><h1>${esc(t(title))}</h1>${sub ? `<p style="color:var(--ink-3);font-size:14px;margin-top:10px">${esc(t(sub))}</p>` : ''}</div>`;
}

/* 商城外壳包装：把内容包进 header + ... + footer */
function shopShell(active, inner, opt) {
  opt = opt || {};
  return `<div class="shop-root">${shopHeader(active)}${inner}${svcStrip()}${shopFooter()}</div>`;
}

/* 搜索 + 商品网格（供 shop / shop-all / shop-new / shop-hot 复用） */
function shopGrid(prods) {
  if (!prods.length) return `<div class="empty"><div class="ic">🔍</div>${t('没有找到商品')}</div>`;
  return `<div class="pgrid">${prods.map(prodCard).join('')}</div>`;
}

loadTg();

render();
