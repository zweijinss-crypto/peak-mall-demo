<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="laptopFrontBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5f2"/>
      <stop offset="1" stop-color="#e9e5df"/>
    </linearGradient>
    <linearGradient id="laptopFrontLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3d"/>
      <stop offset="1" stop-color="#1f1f22"/>
    </linearGradient>
    <linearGradient id="laptopFrontScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#laptopFrontBg)"/>
  <!-- Lid -->
  <rect x="160" y="100" width="480" height="320" rx="14" fill="url(#laptopFrontLid)"/>
  <!-- Screen bezel -->
  <rect x="180" y="118" width="440" height="284" rx="6" fill="url(#laptopFrontScreen)"/>
  <!-- Camera notch -->
  <circle cx="400" cy="116" r="3" fill="#2a2a2d"/>
  <!-- Display content — abstract desktop wallpaper -->
  <rect x="195" y="135" width="410" height="248" rx="4" fill="#1d2530"/>
  <rect x="195" y="135" width="410" height="40" fill="#2a3340"/>
  <circle cx="220" cy="155" r="6" fill="#ff5f57"/>
  <circle cx="240" cy="155" r="6" fill="#febc2e"/>
  <circle cx="260" cy="155" r="6" fill="#28c840"/>
  <rect x="200" y="190" width="80" height="10" rx="2" fill="#3a4a5e"/>
  <rect x="200" y="208" width="120" height="8" rx="2" fill="#2e3a4a"/>
  <rect x="200" y="224" width="100" height="8" rx="2" fill="#2e3a4a"/>
  <rect x="350" y="190" width="240" height="180" rx="4" fill="#2a3445"/>
  <rect x="365" y="205" width="210" height="100" rx="3" fill="#1a242f"/>
  <polygon points="430,235 460,215 490,235 490,275 430,275" fill="#ff8c42"/>
  <text x="220" y="340" font-family="monospace" font-size="10" fill="#5a6a7e">PEAK MALL · DESIGN STUDIO</text>
  <!-- Hinge -->
  <rect x="150" y="420" width="500" height="6" fill="#1a1a1d"/>
  <!-- Bottom base -->
  <path d="M 110 426 L 690 426 L 670 466 L 130 466 Z" fill="#2a2a2d"/>
  <rect x="380" y="438" width="40" height="6" rx="2" fill="#1a1a1d"/>
  <!-- Brand label */}
  <text x="400" y="380" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#3a3a3d" opacity="0.6">PEAK</text>
  <!-- Caption tag -->
  <text x="400" y="530" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3a3a3d">14" · 2.8K OLED Display</text>
</svg>