<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fd560f"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <circle cx="120" cy="80" r="6" fill="#ffffff" fill-opacity="0.25"/>
  <circle cx="1080" cy="120" r="10" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="1140" cy="540" r="8" fill="#ffffff" fill-opacity="0.22"/>
  <circle cx="180" cy="560" r="14" fill="#ffffff" fill-opacity="0.15"/>

  <!-- Brand mark -->
  <rect x="80" y="80" width="76" height="76" rx="18" fill="#ffffff"/>
  <text x="118" y="138" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="56" font-weight="800" text-anchor="middle" fill="#fd560f">P</text>

  <!-- Title -->
  <text x="80" y="280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="78" font-weight="800" fill="#ffffff">Peak Mall</text>
  <text x="80" y="350" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="36" font-weight="600" fill="#ffffff" fill-opacity="0.92">16 SKUs · zh + en · static demo</text>

  <!-- Product preview card -->
  <rect x="700" y="180" width="420" height="360" rx="24" fill="url(#card)" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.18))"/>
  <rect x="730" y="220" width="360" height="6" rx="3" fill="#fd560f" fill-opacity="0.2"/>
  <text x="730" y="270" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Featured</text>
  <text x="730" y="298" font-family="-apple-system,sans-serif" font-size="16" font-weight="500" fill="#64748b">Bilingual catalog · 16 SKUs</text>
  <line x1="730" y1="320" x2="1090" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <text x="730" y="356" font-family="-apple-system,sans-serif" font-size="14" font-weight="500" fill="#475569">$ 28 - USD</text>
  <text x="730" y="378" font-family="-apple-system,sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Free shipping over $50</text>
  <text x="730" y="400" font-family="-apple-system,sans-serif" font-size="13" font-weight="500" fill="#94a3b8">7-day no-reason returns</text>

  <!-- CTA -->
  <rect x="730" y="478" width="160" height="40" rx="20" fill="#fd560f"/>
  <text x="810" y="504" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Shop now</text>

  <!-- Footer -->
  <text x="80" y="580" font-family="-apple-system,sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.85">peak-mall-demo.netlify.app</text>
</svg>